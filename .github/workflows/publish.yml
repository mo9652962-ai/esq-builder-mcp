name: Publish to PyPI

# 打 v* tag（如 v0.1.1）或手动触发 → uv build → OIDC 免 token 发布。
# 前提（一次性）: PyPI 项目 Settings → Publishing 配 Trusted Publisher:
#   Owner=mo9652962-ai  Repository=esq-builder-mcp  Workflow name=publish.yml  Environment=pypi
# 同时记得 bump pyproject 的 version——PyPI 不允许同版本重传。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Run tests before publish
        run: uv run pytest -q

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Build sdist & wheel
        run: uv build

      - name: Generate SBOM (CycloneDX)
        run: uv run --with cyclonedx-py cyclonedx-py environment --output-format json --output-file sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3（SHA 固定）
        with:
          name: sbom-cyclonedx
          path: sbom.json

      # pypi-publish 在 OIDC 模式下默认生成 PEP 740 attestations（provenance）
      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
