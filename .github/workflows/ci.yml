name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# least-privilege：GITHUB_TOKEN 全局只读，个别 job 需要更多权限时在该 job 单独声明
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Run tests（覆盖率棘轮：实测 99%，门槛 97%，只升不降）
        run: uv run pytest -q --cov=esq_builder_mcp --cov-report=term-missing --cov-fail-under=97

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Sync dependencies
        run: uv sync --extra dev
      - name: Ruff 静态检查
        run: uv run ruff check src tests
      - name: Bandit 安全扫描（跳过 assert，测试之外无 assert）
        run: uv run bandit -r src -q --skip B101

  deps-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Sync dependencies
        run: uv sync --extra dev
      - name: pip-audit（已知漏洞扫描，跳过本项目 editable 安装）
        run: uv run --with pip-audit pip-audit --skip-editable --progress-spinner off
