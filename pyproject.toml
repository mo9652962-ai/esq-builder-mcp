[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "esq-builder-mcp"
version = "0.1.0"
description = "ESQ 题库包构建/校验/导入/词表分析 MCP server（墨题刷题机 ESQ 1.0 管道工具化）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "sora" }]
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
]

[project.urls]
Repository = "https://github.com/mo9652962-ai/esq-builder-mcp"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
esq-builder-mcp = "esq_builder_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/esq_builder_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
